0689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_6","code":"3.6","text":"คณะกรรมการบริษัทเข้าใจความเสี่ยงสำคัญของกิจการ และอนุมัติความเสี่ยงที่ยอมรับได้ (Risk Appetite) นโยบาย/กรอบการบริหารความเสี่ยง และวิธีการจัดการความเสี่ยงอย่างเหมาะสม โดยได้มีการทบทวนอย่างสม่ำเสมอ","note":"ข้อมูลสนับสนุน 3.6:คณะกรรมการบริษัทกำหนดนโยบายความเสี่ยง กรอบการบริหารความเสี่ยง และทบทวนอย่างสม่ำเสมอ คณะกรรมการบริษัท ในการประชุมครั้งที่ 3/2569/1 เมื่อวันที่ 27 มีนาคม 2569 พิจารณาและทบทวนเกณฑ์ความเสี่ยงหลักขององค์กร ตัวชี้วัดความเสี่ยงหลัก ระดับความเสี่ยงและช่วงเบี่ยงเบนของระดับความเสี่ยงที่ยอมรับได้ ประจำปี 2569 ของเอ็กโก","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_7","code":"3.7","text":"คณะกรรมการบริษัทกำกับดูแล ให้องค์กรมีการบริหารงานแบบบูรณาการกันทั้งในด้านการกำกับดูแลกิจการที่ดี การบริหารความเสี่ยงและการควบคุมภายใน (GRC: Governance, Risk, Compliance) ตามที่นโยบายได้กำหนดไว้ รวมถึงการมอบข้อสังเกตและข้อเสนอแนะ เพื่อนำไปสู่การปรับปรุงประสิทธิผลของการดำเนินงานของบริษัท โดยยังคงความเป็นอิสระของคณะกรรมการและกระบวนการบูรณาการ GRC","note":"ข้อมูลสนับสนุน 3.7:คณะกรรมการ AC ROC และ CC ประกอบด้วยกรรมการและกรรมการอิสระ ทำหน้าที่ติดตามการดำเนินงานและให้ข้อเสนอแนะด้านการบริหารความเสี่ยง ระบบการควบคุมภายใน และการกำกับดูแลกิจการที่ดี","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_8","code":"3.8","text":"คณะกรรมการบริษัทกำกับดูแลให้ฝ่ายบริหารมีแผนการบริหารความเสี่ยงที่เหมาะสม (มีการระบุความเสี่ยงที่ครอบคลุมทั้งปัจจัยภายนอก/ภายในองค์กรและด้านเทคโนโลยีสารสนเทศ มีการประเมินผลกระทบและโอกาสที่เกิดขึ้น มีการจัดลำดับความเสี่ยง และการบริหารความเสี่ยงที่เหมาะสม) ตลอดจนแผนรับมือกับความเสี่ยงที่เกิดขึ้นใหม่ (Emerging Risk) และรายงานประสิทธิผลของแผนการบริหารความเสี่ยงต่อคณะกรรมการอย่างสม่ำเสมอ","note":"ข้อมูลสนับสนุน 3.8:คณะกรรมการบริษัทได้มอบหมายให้คณะกรรมการกำกับความเสี่ยงทบทวนร่วมกับฝ่ายบริหารในเรื่องนโยบายการบริหารความเสี่ยง การปฏิบัติตามนโยบายทั่วทั้งองค์กร และแนวทางการบริหารความเสี่ยงของกลุ่มเอ็กโก รวมทั้งความเสี่ยงของโครงการและความเสี่ยงที่เกิดขึ้นใหม่","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_9","code":"3.9","text":"คณะกรรมการบริษัทกำกับดูแลให้มีระบบการควบคุมภายในที่เหมาะสม มีการรายงานที่ถูกต้องครบถ้วน เชื่อถือได้และสอดคล้องกับกฎหมาย/กฎระเบียบ/ข้อบังคับที่เกี่ยวข้อง รวมทั้งมีการจัดทำแผนการตรวจสอบภายในอย่างรอบคอบและเหมาะสม โดยพิจารณาจากความเสี่ยง (Risk-based Approach)","note":"ข้อมูลสนับสนุน 3.9:คณะกรรมการบริษัทได้มอบหมายให้คณะกรรมการ AC ทบทวนร่วมกับฝ่ายบริหารในเรื่องการควบคุมภายใน และกำกับดูแลให้มีการปฏิบัติทั่วทั้งองค์กร","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_10","code":"3.10","text":"คณะกรรมการบริษัทกำกับดูแลให้มีแนวปฏิบัติเกี่ยวกับรายการที่เกี่ยวโยงกัน (Related Party Transactions) และรายการที่อาจมีความขัดแย้งของผลประโยชน์ (Conflict of Interest Transaction) ระหว่างบริษัทกับฝ่ายบริหาร คณะกรรมการหรือผู้ถือหุ้น ซึ่งรวมถึงการรายงานการมีส่วนได้เสียของกรรมการและผู้บริหารระดับสูง เพื่อให้สอดคล้องกับกฎหมาย/หลักเกณฑ์ที่เกี่ยวข้อง และมีความโปร่งใส เป็นธรรม (Arm's Length Basis) เพื่อผลประโยชน์ของบริษัทและผู้ถือหุ้นโดยรวมเป็นสำคัญ รวมทั้งกำกับดูแลให้มีการเปิดเผยข้อมูลดังกล่าวที่ถูกต้องครบถ้วน","note":"ข้อมูลสนับสนุน 3.10:ในปี 2569 คณะกรรมการบริษัทในการประชุมครั้งที่ 8/2569 เมื่อวันที่ 26 มิถุนายน 2569 อนุมัตินโยบายการทำรายการระหว่างกันและรายการที่เกี่ยวโยงกัน โดยมอบหมายให้คณะกรรมการ AC พิจารณาความสมเหตุสมผลของการทำรายการระหว่างกันและรายการที่เกี่ยวโยงกัน นอกจากนี้คณะกรรมการบริษัทยังมีนโยบายที่จะไม่ให้มีการขัดแย้งระหว่างผลประโยชน์ส่วนตัวและผลประโยชน์ของเอ็กโก จัดทำรายงานการถือครองหลักทรัพย์และรายงานการมีส่วนได้เสียของบุคลากรเอ็กโกตามหน้าที่ที่ได้กำหนดจรรยาบรรณธุรกิจและนโยบายและแนวปฏิบัติการป้องกันความขัดแย้งของผลประโยชน์ กรรมการที่มีส่วนได้เสียจะต้องไม่รับเอกสารการประชุมที่เกี่ยวข้อง งดเว้นจากการร่วมอภิปรายให้ความเห็น การลงคะแนนเสียง หรือการตัดสินใจในรายการดังกล่าว","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_11","code":"3.11","text":"คณะกรรมการบริษัทกำกับดูแลให้มีระบบบัญชี การรายงานทางการเงินและที่ไม่เกี่ยวกับการเงิน ตลอดจนการเปิดเผยข้อมูลที่ถูกต้อง ครบถ้วน เพียงพอ ทันกาล เป็นไปตามกฎเกณฑ์/มาตรฐาน/แนวปฏิบัติที่เกี่ยวข้อง รวมทั้งดูแลให้มีบุคลากรที่มีความรู้ ทักษะ ประสบการณ์ในการจัดการเรื่องดังกล่าว","note":"ข้อมูลสนับสนุน 3.11:คณะกรรมการบริษัทรับผิดชอบดูแลให้ระบบการจัดทำรายงานทางการเงินและการเปิดเผยข้อมูลสำคัญต่าง ๆ ถูกต้อง เพียงพอ ทันเวลา เป็นไปตามกฎเกณฑ์ มาตรฐาน และแนวปฏิบัติที่เกี่ยวข้อง โดยคณะกรรมการบริษัทมีการทบทวนนโยบายและแนวปฏิบัติด้านการเปิดเผยข้อมูลเป็นประจำ โดยได้มอบหมายให้ฝ่ายเลขานุการบริษัท ฝ่ายสื่อสารองค์กร ฝ่ายนักลงทุนสัมพันธ์ ฝ่ายบัญชี และฝ่ายบัญชีบริหารและวิเคราะห์ ทำหน้าที่เปิดเผยงบการเงิน โดยผ่านความเห็นชอบจากคณะกรรมการ AC","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_12","code":"3.12","text":"คณะกรรมการบริษัทติดตามดูแลสภาพคล่องทางการเงินและความสามารถในการชำระหนี้ของบริษัทโดยสม่ำเสมอ และพิจารณาสภาพคล่องทางการเงินก่อนตัดสินใจในการลงทุน","note":"ข้อมูลสนับสนุน 3.12:คณะกรรมการบริษัทมอบหมายให้ ROC และ IC พิจารณาร่วมกับฝ่ายบริหารเกี่ยวกับสภาพคล่องทางการเงินและความสามารถในการชำระหนี้ก่อนนำเสนอโครงการลงทุนต่อคณะกรรมการบริษัททุกครั้ง","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_13","code":"3.13","text":"คณะกรรมการบริษัทกำกับดูแลการใช้เทคโนโลยีสารสนเทศและข้อมูล* และนโยบายด้านปัญญาประดิษฐ์ (AI) ร่วมกับฝ่ายบริหารในการจัดทำแผนกลยุทธ์ด้านเทคโนโลยีสารสนเทศให้สอดคล้องกับกลยุทธ์ขององค์กร*กำกับดูแลให้เป็นไปตามกรอบการกำกับดูแลด้านเทคโนโลยีสารสนเทศ (IT and Data Governance) ครอบคลุมนโยบายการจัดสรรทรัพยากรด้านเทคโนโลยีสารสนเทศ การรักษาความปลอดภัย (IT Security) การรักษาความลับของข้อมูล (Confidentiality) การรักษาความน่าเชื่อถือ (Integrity) ความพร้อมใช้ของข้อมูล (Availability) และการจัดการข้อมูลที่อาจมีผลกระทบต่อราคาหลักทรัพย์ (Market Sensitive Information) เป็นต้น","note":"ข้อมูลสนับสนุน 3.13:คณะกรรมการบริษัทได้ร่วมพิจารณาแผนกลยุทธ์ด้านเทคโนโลยีสารสนเทศ ในการประชุมสัมมนาแผนกลยุทธ์องค์กร เมื่อวันที่ 29 สิงหาคม 2569 ณ พัทยา โดยมีแผนพัฒนาองค์กรให้เป็น AI Driven Organization ซึ่งเป็นแผนต่อเนื่องจากปี 2568 โดยคณะกรรมการบริษัทได้มอบหมายให้คณะกรรมการ CC กำกับดูแลเรื่องของการปฏิบัติตามนโยบาย IT Security","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_14","code":"3.14","text":"คณะกรรมการบริษัทพิจารณาและอภิปรายเกี่ยวกับประเด็นต่าง ๆ อย่างละเอียดรอบคอบ ใช้เวลาอย่างมีประสิทธิภาพ โดยเฉพาะอย่างยิ่ง ในกรณีที่เป็นเรื่องซับซ้อน หรือมีความละเอียดอ่อน (Sensitive Issue) และให้ข้อเสนอแนะอย่างเป็นอิสระและเป็นกลาง ยอมรับความเห็นที่แตกต่างระหว่างกัน โดยไม่เกิดความขัดแย้ง","note":"","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_15","code":"3.15","text":"คณะกรรมการบริษัทมีส่วนร่วมกับฝ่ายบริหารในการพิจารณาแก้ไขปัญหาอย่างเหมาะสม เมื่อการปฏิบัติหน้าที่ของฝ่ายบริหารไม่เป็นไปตามเป้าหมาย แผนธุรกิจ หรืองบประมาณที่กำหนด และให้คำแนะนำอย่างสร้างสรรค์และทันเวลา (Real-Time Feedback) และสร้างแรงบันดาลใจต่อฝ่ายบริหาร","note":"","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_16","code":"3.16","text":"คณะกรรมการบริษัทจัดการแก้ไขปัญหาในสถานการณ์วิกฤติอย่างระมัดระวัง รอบคอบ ภายในระยะเวลาที่เหมาะสม และเป็นไปในเชิงบวก รวมทั้งกำหนดแผนบริหารจัดการสถานการณ์วิกฤติเพื่อรักษาผลประโยชน์ขององค์กรได้อย่างมีประสิทธิผล","note":"ข้อมูลสนับสนุน 3.16:ในปี 2569 บริษัทไม่ได้เผชิญกับสถานการณ์วิกฤติ ทั้งนี้ บริษัทมีแผนความต่อเนื่องทางธุรกิจรองรับการบริหารจัดการในกรณีเกิดสถานการณ์วิกฤติ และจะรายงานให้คณะกรรมการบริษัทรับทราบทันทีเมื่อเกิดสถานการณ์ดังกล่าวนอกจากนี้ คณะกรรมการบริษัทและคณะกรรมการ ROC กำกับดูแลให้มีการประเมินความเสี่ยงและผลกระทบของสถานการณ์ต่าง ๆ ที่เกิดขึ้น รวมถึงหามาตรการจัดการความเสี่ยงเพื่อเตรียมรองรับสถานการณ์ดังกล่าว เช่น ภาวะสงครามระหว่างสหรัฐอเมริกาและอิสราเอล","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_17","code":"3.17","text":"คณะกรรมการบริษัทกำกับดูแลว่าดัชนีวัดผลการดำเนินงาน (KPI) และกรอบการประเมินผลการปฏิบัติงานของกรรมการผู้จัดการใหญ่ และรองกรรมการผู้จัดการใหญ่นั้น สอดคล้องกับเป้าหมายและวัตถุประสงค์ของบริษัท ทั้งในระยะสั้นและระยะยาว รวมถึงแนวโน้มและทิศทางในภาคอุตสาหกรรม และสามารถสะท้อนให้เห็นถึงประสิทธิภาพและความสามารถในการบริหารจัดการ โดยได้สื่อสารให้รับทราบล่วงหน้า และได้ใช้เวลาอย่างเพียงพอในการประเมินผลการปฏิบัติงานของกรรมการผู้จัดการใหญ่และรองกรรมการผู้จัดการใหญ่ ตามเกณฑ์ที่กำหนดไว้เป็นประจำทุกปี","note":"ข้อมูลสนับสนุน 3.17:คณะกรรมการบริษัทในการประชุมครั้งที่ 8/2569/2 และ 9/2569/2 เมื่อวันที่ 26 มิถุนายน และ 24 กรกฎาคม 2569 ซึ่งผ่านการเสนอแนะของคณะกรรมการ NRC ในการประชุมครั้งที่ 6/2569 เมื่อวันที่ 24 มิถุนายน 2569 ได้พิจารณาอนุมัติดัชนีวัดผลการดำเนินงานและกรอบการประเมินผลการปฏิบัติงานของรองกรรมการผู้จัดการใหญ่ ซึ่งสอดคล้องกับ Corporate KPI ปี 2569คณะกรรมการบริษัทในการประชุมครั้งที่ 8/2569/2 เมื่อวันที่ 26 มิถุนายน ซึ่งผ่านการเสนอแนะของคณะกรรมการ NRC ในการประชุมครั้งที่ 6/2569 เมื่อวันที่ 24 มิถุนายน 2569 ได้พิจารณาอนุมัติดัชนีวัดผลการดำเนินงานและกรอบการประเมินผลการปฏิบัติงานของกรรมการผู้จัดการใหญ่ ซึ่งสอดคล้องกับ Corporate KPI ปี 2569","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_18","code":"3.18","text":"คณะกรรมการบริษัท คณะกรรมการชุดย่อย ประธานคณะกรรมการ กรรมการผู้จัดการใหญ่ และฝ่ายบริหารมีความสัมพันธ์ที่ดีต่อกันและทำงานร่วมกันได้ดี ให้เกียรติและเคารพสิทธิซึ่งกันและกัน ทำให้การสื่อสารและการแลกเปลี่ยนข้อมูลมีประสิทธิผล โดยกรรมการผู้จัดการใหญ่และฝ่ายบริหารสามารถขอคำแนะนำจากกรรมการ และกรรมการสามารถขอข้อมูล/เอกสารที่จำเป็นเพิ่มเติมจากฝ่ายบริหารได้ภายในเวลาที่ต้องการ","note":"","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_19","code":"3.19","text":"คณะกรรมการบริษัทสนับสนุนให้ฝ่ายบริหารดำเนินงานอย่างเป็นอิสระ ภายใต้กรอบ/นโยบาย/แผนงานที่ได้รับอนุมัติ โดยไม่แทรกแซงการปฏิบัติหน้าที่ของฝ่ายบริหาร","note":"ข้อมูลสนับสนุน 3.19:คณะกรรมการบริษัทแต่งตั้งกรรมการผู้จัดการใหญ่เพื่อทำหน้าที่หัวหน้าของฝ่ายบริหาร ซึ่งรับผิดชอบการบริหารจัดการธุรกิจและนำนโยบายและกลยุทธ์ไปปฏิบัติ โดยมอบอำนาจหน้าที่ในการบริหารงานให้แก่กรรมการผู้จัดการใหญ่ และมีการแบ่งแยกอำนาจระหว่างคณะกรรมการและฝ่ายบริหารไว้ในตารางอำนาจดำเนินการ","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_20","code":"3.20","text":"คณะกรรมการบริษัทกำกับดูแลให้โครงสร้างค่าตอบแทนกรรมการผู้จัดการใหญ่และผู้บริหารระดับสูง (ทั้งที่เป็นตัวเงินและไม่เป็นตัวเงิน) มีความเหมาะสม โปร่งใส เป็นธรรม สอดคล้องกับบทบาทหน้าที่ ความรับผิดชอบ ผลการดำเนินงาน เป้าหมายองค์กรทั้งในระยะสั้นและระยะยาว และเปรียบเทียบได้กับอุตสาหกรรมเดียวกัน","note":"ข้อมูลสนับสนุน 3.20:คณะกรรมการบริษัททำหน้าที่ประเมินผลการปฏิบัติงานของกรรมการผู้จัดการใหญ่และรองกรรมการผู้จัดการใหญ่ รวมถึงอนุมัติการปรับอัตราค่าตอบแทนและการให้โบนัส โดยผ่านการเสนอแนะจากคณะกรรมการ NRC ซึ่งได้เปรียบเทียบแนวปฏิบัติในอุตสาหกรรมเดียวกัน และสอดคล้องกับเป้าหมายองค์กร","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_21","code":"3.21","text":"คณะกรรมการบริษัทติดตามดูแลการบริหารและพัฒนาบุคลากรให้มีจำนวน ความรู้ ทักษะ ประสบการณ์และแรงจูงใจที่เหมาะสม","note":"ข้อมูลสนับสนุน 3.21:คณะกรรมการบริษัทมอบหมายให้คณะกรรมการ NRC ติดตามดูแลการบริหารและพัฒนาบุคลากรให้มีอัตรากำลัง ความรู้ ทักษะ ประสบการณ์ และแรงจูงใจที่เหมาะสม","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_22","code":"3.22","text":"ประธานกรรมการแสดงบทบาทเป็นผู้นำ และปฏิบัติหน้าที่อย่างเหมาะสม เช่น กำกับดูแลการปฏิบัติหน้าที่ของคณะกรรมการบริษัทให้เป็นไปอย่างมีประสิทธิภาพ ส่งเสริมให้องค์กรมีวัฒนธรรมองค์กรที่ดี มีจริยธรรมและการกำกับดูแลกิจการที่ดี จัดสรรเวลาอย่างเพียงพอให้ฝ่ายบริหารเสนอเรื่อง และส่งเสริมการอภิปรายอย่างเป็นอิสระ ตลอดจนเสริมสร้างความสัมพันธ์อันดีระหว่างกรรมการและฝ่ายบริหาร","note":"","weight":3.4482758620689653,"min":1,"max":4,"step":1,"direction":"high","labels":{}},{"id":"BOD_q3_23","code":"3.23","text":"คณะกรรมการบริษัทกำหนด/ทบทวนเกณฑ์การประเมินผลการปฏิบัติ function name(id){if(id==='AVERAGE')return 'ค่าเฉลี่ย';return P.people.find(x=>x.id===id)?.name||P.committees.find(x=>x.id===id)?.name||id;}
function getForm(id=formId){return P.forms.find(f=>f.id===id);}
function response(job){return P.responses.find(r=>r.formId===job.formId&&r.raterId===job.raterId&&r.targetId===job.targetId);}
function getResponse(job){let r=response(job);if(!r){r={id:M.uid('response'),...job,answers:{},comment:'',updatedAt:new Date().toISOString()};P.responses.push(r);}return r;}
function locked(f){return f.status==='locked'||P.responses.some(r=>r.formId===f.id);}
function option(v,text,sel){return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(text)}</option>`;}
function resetUI(){formId='';entryRater='';jobKey='';entryDim=0;reportTarget='';reportForm='';drill='root';reportKind='committee';reportTab='overview';page='results';}
function kindSeg(){return `<div class="seg"><button data-act="report-kind" data-kind="committee" class="${reportKind==='committee'?'active':''}">รายคณะ</button><button data-act="report-kind" data-kind="person" class="${reportKind==='person'?'active':''}">รายบุคคล</button></div>`;}
function render(){
 document.body.classList.toggle('presentation',mode);$('#year').textContent=P.year;$('#projectName').textContent=P.title;$('#projectBadge').textContent=P.demo?'ข้อมูลจำลอง / DEMO':mean4()?'ข้อมูลจริง':'โครงการทำงาน';$('#projectBadge').className='badge'+(P.demo?' demo':mean4()?' real':'');$('#projectBadge').title=P.dataset?P.dataset.label+' · '+P.dataset.id:'';$('#projectBadge').hidden=!P.demo&&mean4();$('#demoBtn').textContent=P.id===REAL.id?'เปิดเดโมข้อมูลสมมติ →':'← กลับชุดข้อมูลจริง';$('#newWorkBtn').hidden=!P.demo;$('#modeBtn').textContent=mode?'← กลับโหมดทำงาน':'เข้าสู่โหมดนำเสนอ ↗';$('#modeBtn').setAttribute('aria-pressed',mode);
 $('#headerKind').innerHTML=mean4()&&(mode||page==='results')?kindSeg():'';$('#nav').innerHTML=[['results','ผลการประเมิน',''],['people','บุคคลและคณะ',P.people.filter(p=>p.active).length],['forms','แบบสอบถามและสเกล',P.forms.length],['pairs','คู่ประเมินไขว้',P.assignments.length],['entry','กรอกคำตอบ',''],...(mean4()?[['sources','แหล่งข้อมูลและการตรวจ',P.anomalies?.length||'']]:[])].map(([k,t,n])=>`<button data-act="page" data-page="${k}" class="${page===k?'active':''}" ${page===k?'aria-current="page"':''}><span class="nav-icon">${icon(k)}</span>${t}${n?`<span class="nav-count">${n}</span>`:''}</button>`).join('');

function peoplePage(){
 const active=P.people.filter(x=>x.active);const list=P.people.filter(x=>x.name.includes(personSearch)||x.id.includes(personSearch.toUpperCase()));

function pairsPage(){const a=M.assignmentAudit(P);return head('03 / CROSS ASSESSMENT','คู่ประเมินไขว้','ตั้งต้นจากไฟล์ผลสุ่ม · ผู้ประเมิน 1 คนประเมินกรรมการท่านอื่น 4 คน',`<button class="btn primary" data-act="add-pair">+ เพิ่มคู่ประเมิน</button>`)+`<div class="key-stats"><div><b>${a.total}</b><span>คู่ประเมินทั้งหมด</span></div><div><b>${Object.values(a.out).filter(n=>n===4).length}</b><span>คนที่ประเมินครบ 4 คน</span></div><div><b>${Object.values(a.inc).filter(n=>n===4).length}</b><span>คนที่ถูกประเมินครบ 4 ครั้ง</span></div></div><div class="notice ${a.errors.length||!a.baseline?'amber':'green'}">${a.errors.length?esc(a.errors.join(' · ')):a.baseline?'ครบเงื่อนไขไฟล์เริ่มต้น: 15 คน / 60 คู่ / ไม่มีประเมินตัวเอง / ไม่มีคู่ย้อนกลับ':'โครงสร้างต่างจากเงื่อนไขเริ่มต้น โปรดตรวจจำนวนคู่เข้า–ออกก่อนเริ่มงาน'}</div><section class="panel"><div class="table-scroll"><table><thead><tr><th>ผู้ประเมิน</th><th>ผู้ถูกประเมิน</th><th>ประเมิน / ถูกประเมิน</th></tr></thead><tbody>${P.people.filter(x=>x.active).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${P.assignments.filter(x=>x.raterId===p.id).map(x=>`<span class="pill">${esc(name(x.targetId))} <button class="text-btn" style="padding:0" aria-label="ลบคู่ประเมิน" data-act="remove-pair" data-rater="${esc(p.id)}" data-target="${esc(x.targetId)}">×</button></span>`).join('')||'—'}</td><td>${a.out[p.id]||0} / ${a.inc[p.id]||0}</td></tr>`).join('')}</tbody></table></div></section>`;}
function newQuestion(){return {id:M.uid('q'),text:'ข้อคำถามใหม่',weight:100,min:1,max:4,step:1,direction:'high',labels:{}};}
function newAspect(){return {id:M.uid('a'),name:'ด้านใหม่',weight:100,questions:[newQuestion()]};}
function newDimension(){return {id:M.uid('d'),name:'มิติใหม่',weight:100,aspects:[newAspect()]};}
function sumLabel(xs){const n=M.sum(xs.map(x=>x.weight));return `<span data-nodes="${xs.map(x=>x.id).join('|')}" class="weight-sum ${M.near(n,100)?'':'bad'}">น้ำหนักรวม ${short(n)} / 100%</span>`;}
function weightInput(f,n){return `<input type="number" class="weight-input" aria-label="น้ำหนัก (%)" title="น้ำหนัก (%)" data-change="node-field" data-form="${f.id}" data-node="${n.id}" data-field="weight" value="${n.weight}" min="0.001" max="100" step="any" ${locked(f)?'disabled':''}>`;}
function formsPage(){
 let f=getForm();if(!f&&P.forms.length){f=P.forms[0];formId=f.id;}
 const top=head('02 / QUESTIONNAIRE DESIGN','แบบสอบถามและสเกล','กำหนดมิติ ด้าน ข้อ และคะแนนที่ใช้ได้ในแต่ละข้อ',`<button class="btn primary" data-act="new-form">+ สร้างแบบสอบถาม</button>`);
 if(!f)return top+empty('สร้างแบบสอบถามก่อนเริ่มกรอก','ยังไม่มีแบบสอบถามจริง สามารถสร้างโครงสร้างเองและกำหนดสเกลรายข้อได้ ไม่ใช้ข้อจำลองแทนแบบจริง','new-form','สร้างแบบสอบถาม');
 designerDim=Math.max(0,Math.min(designerDim,f.dimensions.length-1));

่วมหลายข้อ</button>`:''}</div><div class="section-title"><h3>น้ำหนักระดับมิติ</h3>${sumLabel(f.dimensions)}</div><div class="steps">${f.dimensions.map((d,i)=>`<button class="step ${i===designerDim?'active':''}" data-act="designer-dim" data-index="${i}">${i+1}. ${esc(d.name)} · ${short(d.weight)}%</button>`).join('')}</div>${f.dimensions.map((d,di)=>({d,di})).filter(({di})=>di===designerDim).map(({d,di})=>`<div class="form-tree"><div class="tree-head"><span class="pill">มิติ ${di+1}</span><input class="name-input" data-change="node-field" data-form="${f.id}" data-node="${d.id}" data-field="name" value="${esc(d.name)}" aria-label="ชื่อมิติ" ${isLocked?'disabled':''}>${weightInput(f,d)}<span class="muted">%</span>${!isLocked?`<button class="btn small" data-act="move-node" data-form="${f.id}" data-node="${d.id}" data-dir="-1" aria-label="เลื่อนมิติขึ้น">↑</button><button class="btn small" data-act="move-node" data-form="${f.id}" data-node="${d.id}" data-dir="1" aria-label="เลื่อนมิติลง">↓</button><button class="btn small danger" data-act="delete-node" data-form="${f.id}" data-node="${d.id}">ลบ</button>`:''}</div><div class="tree-body">${sumLabel(d.aspects)}${d.aspects.map((a,ai)=>`<div class="aspect"><div class="aspect-head"><span class="pill">ด้าน ${di+1}.${ai+1}</span><input class="grow" data-change="node-field" data-form="${f.id}" data-node="${a.id}" data-field="name" value="${esc(a.name)}" aria-label="ชื่อด้าน" ${isLocked?'disabled':''}>${weightInput(f,a)}<span class="muted">%</span>${!isLocked?`<button class="btn small" data-act="move-node" data-form="${f.id}" data-node="${a.id}" data-dir="-1" aria-label="เลื่อนด้านขึ้น">↑</button><button class="btn small" data-act="move-node" data-form="${f.id}" data-node="${a.id}" data-dir="1" aria-label="เลื่อนด้านลง">↓</button><button class="btn small danger" data-act="delete-node" data-form="${f.id}" data-node="${a.id}">ลบ</button>`:''}</div>${sumLabel(a.questions)}${a.questions.map((q,qi)=>questionEditor(f,q,di,ai,qi)).join('')}${!isLocked?`<button class="text-btn" data-act="add-question" data-form="${f.id}" data-node="${a.id}">+ เพิ่มข้อในด้านนี้</button>`:''}</div>`).join('')}${!isLocked?`<button class="btn small" data-act="add-aspect" data-form="${f.id}" data-node="${d.id}">+ เพิ่มด้านในมิตินี้</button>`:''}</div></div>`).join('')}${!isLocked?`<div class="draft-errors">${err.slice(0,15).map(x=>'<div>• '+esc(x)+'</div>').join('')}</div><button class="btn primary" data-act="lock-form" data-id="${f.id}" ${err.length?'disabled':''}>ยืนยันแบบสอบถาม สเกล และน้ำหนัก</button><button class="btn danger" style="margin-left:10px" data-act="delete-form" data-id="${f.id}">ลบร่างนี้</button>`:''}</section>`;
}
function questionEditor(f,q,di,ai,qi){const lock=locked(f),bind=field=>`data-change="node-field" data-form="${f.id}" data-node="${q.id}" data-field="${field}" ${lock?'disabled':''}`;const n= M.scaleValid(q)?Math.round((q.max-q.min)/q.step)+1:0;return `<div class="q-editor"><div class="q-top"><span class="pill">ข้อ ${di+1}.${ai+1}.${qi+1}</span><input class="grow" ${bind('text')} value="${esc(q.text)}" aria-label="ข้อความคำถาม">${weightInput(f,q)}<span class="muted">%</span>${!lock?`<button class="btn small" data-act="move-node" data-form="${f.id}" data-node="${q.id}" data-dir="-1" aria-label="เลื่อนข้อขึ้น">↑</button><button class="btn small" data-act="move-node" data-form="${f.id}" data-node="${q.id}" data-dir="1" aria-label="เลื่อนข้อลง">↓</button><button class="btn small danger" data-act="delete-node" data-form="${f.id}" data-node="${q.id}">ลบ</button>`:''}</div><div class="scale-fields"><div class="field"><label>ต่ำสุด</label><input type="number" step="any" ${bind('min')} value="${q.min}"></div><div class="field"><label>สูงสุด</label><input type="number" step="any" ${bind('max')} value="${q.max}"></div><div class="field"><label>ระยะขั้น</label><input type="number" step="any" ${bind('step')} value="${q.step}"></div><div class="field"><label>ทิศทางคะแนน</label><select ${bind('direction')}>${option('high','คะแนนสูงสะท้อนผลดีกว่า',q.direction)}${option('low','คะแนนต่ำสะท้อนผลดีกว่า',q.direction)}</select></div></div><details><summary>คำอธิบายระดับคะแนน (${n} ระดับ) · ทุกข้อมีตัวเลือก “ไม่ตอบ”</summary><div class="labels-grid">${Array.from({length:n},(_,i)=>{const v=Number((q.min+i*q.step).toFixed(8));return `<label>${v}<input data-change="score-label" data-form="${f.id}" data-node="${q.id}" data-value="${v}" value="${esc(q.labels[v]||'')}" placeholder="ความหมายของคะแนน ${v}" ${lock?'disabled':''}></label>`;}).join('')}</div></details></div>`;}
function entryPage(){const people=P.people.filter(x=>x.active);if(!people.some(x=>x.id===entryRater))entryRater=people[0]?.id||'';const js=M.jobs(P,entryRater);let job=js.find(x=>jobID(x)===jobKey);if(!job){job=js[0];jobKey=job?jobID(job):'';entryDim=0;}const top=head('04 / RESPONSE ENTRY','กรอกคำตอบทีละชุด','เลือกผู้ประเมิน แล้วกรอกคำตอบจากแบบสอบถามที่ได้รับจริง');if(!P.forms.some(f=>f.status==='locked'))return top+empty('ยังไม่มีแบบสอบถามที่ยืนยันแล้ว','ตั้งโครงสร้าง สเกล และน้ำหนักให้ครบ แล้วกดยืนยันแบบสอบถามก่อนเริ่มกรอก','go-forms','ตั้งแบบสอบถาม');return top+`<div class="field" style="max-width:420px"><label>กำลังกรอกคำตอบของผู้ประเมิน</label><select data-change="entry-rater" aria-label="ผู้ประเมินที่กำลังกรอก">${people.map(p=>option(p.id,p.name,entryRater)).join('')}</select></div><div class="job-layout"><section><div class="panel-head"><h3>ชุดแบบประเมินของบุคคลนี้</h3><span class="pill">${js.length} ชุด</span></div><div class="job-list">${js.map(j=>{const f=getForm(j.formId),r=response(j),done=Object.keys(r?.answers||{}).length,total=M.questions(f).length;return `<button class="job ${jobID(j)===jobKey?'active':''}" data-act="job" data-key="${jobID(j)}"><small>${esc(kindName[f.kind])} · v${f.version}</small><b>${esc(name(j.targetId))}</b><small>${esc(f.name)}</small><div class="progress" style="margin:9px 0"><i style="width:${total?done/total*100:0}%"></i></div><small>${done===0?'ยังไม่เริ่ม':done===total?'ระบุคำตอบครบ':'กำลังกรอก'} · ${done}/${total} ข้อ</small></button>`;}).join('')||'<div class="notice">ยังไม่มีงานสำหรับบุคคลนี้ ตรวจคู่ประเมินและสมาชิกคณะ</div>'}</div></section>${job?responseEditor(job):'<section class="panel empty"><h3>ยังไม่มีชุดคำตอบ</h3></section>'}</div>`;}

function averageReportStat(f){const ids=P.people.filter(x=>x.active).map(x=>x.id),stats=ids.map(id=>M.aggregate(P,f,id));const walk=nodes=>{const out=M.clone(nodes[0]);out.value=M.mean(nodes.map(x=>x.value).filter(x=>x!==null));out.n=null;out.children=(out.children||[]).map((_,i)=>walk(nodes.map(x=>x.children[i])));return out;};if(!stats.length)return null;const r=walk(stats);r.rows=stats.flatMap(x=>x.rows);r.respondents=ids.length;r.respondentIds=ids;return r;}
function reportContext(){const people=P.people.filter(x=>x.active);let fs=M.reportForms(P).filter(f=>f.status==='locked'&&(reportKind==='committee'?f.kind==='committee':f.kind!=='committee'));let f,targets;
 if(mean4()&&reportKind!=='committee'){fs=fs.filter(x=>x.kind==='self'&&!x.virtual);reportForm=fs[0]?.id||'';}
 if(mean4()&&reportKind==='committee'){targets=P.committees.filter(c=>fs.some(x=>x.committeeIds.includes(c.id)));if(!targets.some(x=>x.id===reportTarget))reportTarget=targets[0]?.id||'';f=fs.find(x=>x.committeeIds.includes(reportTarget));reportForm=f?.id||'';}
 else{f=fs.find(x=>x.id===reportForm);if(!f){f=mean4()?fs[0]:fs.slice().sort((a,b)=>b.version-a.version)[0];reportForm=f?.id||'';}targets=reportKind==='committee'?P.committees.filter(c=>!f?.committeeIds.length||f.committeeIds.includes(c.id)):mean4()?[{id:'AVERAGE',name:'ค่าเฉลี่ย'},...people]:people;if(!targets.some(x=>x.id===reportTarget))reportTarget=targets[0]?.id||'';}
 const r=f&&reportTarget?(reportTarget==='AVERAGE'?averageReportStat(f):M.aggregate(P,f,reportTarget)):null;const other=f?M.counterpart(P,f):null;const rr=other&&reportTarget?(reportTarget==='AVERAGE'?averageReportStat(other):M.aggregate(P,other,reportTarget)):null;if(r&&rr&&!mean4()){const align=(a,b)=>{b.id=a.id;a.children.forEach((x,i)=>align(x,b.children[i]));};align(r,rr);}return {fs,f,targets,r,other,rr};}

function radarSeries(c){
 const primary=c.f.kind==='peer'?c.other:c.f,peer=c.f.kind==='peer'?c.f:c.other;
 const actuals=c.r.children.map(x=>statPair(c,x.id));
 if(mean4()&&reportKind==='committee')return [{label:'ผลการประเมินรายคณะ',color:'#004485',values:actuals.map(a=>a[0]?.value??null),mean:false}];
 const average=f=>{if(!f)return null;const targets=reportKind==='committee'?P.committees.filter(x=>!f.committeeIds.length||f.committeeIds.includes(x.id)):P.people.filter(x=>x.active);const stats=targets.map(x=>M.aggregate(P,f,x.id));return c.r.children.map((_,i)=>M.mean(stats.map(x=>x.children[i]?.value??null).filter(x=>x!==null)));};
 const series=[{label:reportKind==='committee'?'ผลการประเมินรายคณะ':'ผลการประเมินตนเอง',color:'#004485',values:actuals.map(a=>a[0]?.value??null),mean:false}];
 if(peer)series.push({label:'ผลการประเมินแบบไขว้',color:'#E50019',values:actuals.map(a=>a[1]?.value??null),mean:false});
 if(showMeans&&reportTarget!=='AVERAGE'){const nP=P.people.filter(x=>x.active).length;if(primary)series.push({label:reportKind==='committee'?'ค่าเฉลี่ยทุกคณะ':'ผลการประเมินรายบุคคลเฉลี่ย',color:'#7c8796',values:average(primary),mean:true,dash:'7 5'});if(peer)series.push({label:'ผลการประเมินแบบไขว้เฉลี่ย',color:'#394b61',values:average(peer),mean:true,dash:'2 4'});}
 return series;
}
function radar(c){
 const com=reportKind==='committee',cx=com?600:360,cy=com?420:245,radius=com?200:175;const ns=c.r.children,n=ns.length;radarTooltipData={nodes:ns,series:radarSeries(c).filter(s=>!hiddenSeries.has(s.label))};
 if(n<3)return `<div class="notice">ข้อมูลมีน้อยกว่า 3 ${DIM()} แสดงเป็นแท่งเพื่ออ่านได้ชัดเจน</div>`+bars(c,ns);

function color(v){if(v===null)return {bg:'#f3f6fa',ink:'#91a0b0'};const t=Math.max(0,Math.min(1,ratio(v))),a=[239,245,251],b=[0,68,133],rgb=a.map((v,i)=>Math.round(v+(b[i]-v)*t));return {bg:`rgb(${rgb.join(',')})`,ink:t>.58?'#fff':'#285478'};}
function heatmap(c){const cs=P.committees.filter(x=>!c.f.committeeIds.length||c.f.committeeIds.includes(x.id));return `<section class="panel"><div class="panel-head"><div><h2>เทียบภาพรวมระหว่างคณะ</h2><p>สีใช้ช่วงเดียวกัน 0–100 · เข้มขึ้นเมื่อคะแนนสูงขึ้น · เปรียบเทียบแบบสอบถามเดียวกัน</p></div><label class="muted"><input type="checkbox" data-change="show-numbers" ${showNumbers?'checked':''}> แสดงตัวเลขทั้งหมด</label></div><div class="heatmap-wrap"><div class="heatmap" style="grid-template-columns:minmax(110px,1.4fr) repeat(${c.f.dimensions.length},minmax(45px,1fr))"><div class="heat-header">คณะ / มิติ</div>${c.f.dimensions.map((d,i)=>`<div class="heat-header" title="${esc(d.name)}">${esc(d.name)}</div>`).join('')}${cs.map(com=>{const r=M.aggregate(P,c.f,com.id);return `<div class="heat-label">${esc(com.name)}</div>${r.children.map(x=>{const col=color(x.value);return `<button class="heat-cell ${x.value===null?'empty-cell':''}" style="background:${col.bg};color:${col.ink}" data-act="heat-detail" data-target="${com.id}" data-id="${x.id}" aria-label="${esc(com.name)} ${esc(x.node.name)} ${fmt(x.value)}" title="${esc(com.name)} · ${esc(x.node.name)}: ${fmt(x.value)}">${showNumbers?fmt(x.value):x.value===null?'—':'↗'}</button>`;}).join('')}`;}).join('')}</div></div><div class="color-key"><span>ต่ำสุด 0</span><i></i><span>สูงสุด 100</span><span>· ลายทแยง = ไม่มีข้อมูล</span></div></section>`;}
function personCompare(c){const val=M.benchmark(P,c.f);return `<section class="panel"><div class="panel-head"><div><h2>มุมเปรียบเทียบรายบุคคล</h2><p>ฐานอ้างอิงเฉพาะบุคคลที่มีข้อมูลในโครงการนี้${mean4()?' · ฐานเดียวกับมุมมองที่เลือก ('+esc(c.f.virtual?'17 ข้อที่ตรงกัน':M.questions(c.f).length+' ข้อ')+')':''} · ไม่ใช่มาตรฐานภายนอก</p></div></div><div class="mini-stat"><span>ค่าเฉลี่ยรายบุคคลของแบบนี้ (ให้แต่ละคนมีน้ำหนักเท่ากัน)</span><b>${fmt(val)}</b></div><div class="mini-stat"><span>คะแนนบุคคลนี้ลบค่าเฉลี่ย</span><b class="${c.r.value!==null&&val!==null&&c.r.value-val>=0?'positive':'negative'}">${signed(c.r.value!==null&&val!==null?c.r.value-val:null)}</b></div></section>`;}
function statPath(r,id,path=[]){if(r.id===id)return [...path,r];for(const c of r.children){const v=statPath(c,id,[...path,r]);if(v)return v;}return null;}
function detailView(c){const s=M.findStat(c.r,drill)||c.r;drill=s.id;const path=statPath(c.r,drill)||[c.r];return `<div class="breadcrumbs">${path.map((x,i)=>`${i?' / ':''}<button data-act="drill" data-id="${x.id}">${esc(nodeName(x.node))}</button>`).join('')}</div><section class="panel"><div class="panel-head"><div><span class="section-kicker">${({overview:'OVERVIEW',dimension:mean4()?'AREA':'DIMENSION',aspect:'ASPECT',question:'QUESTION'})[s.level]}</span><h2>${esc(nodeName(s.node))}</h2><p>${mean4()?(s.level==='question'?'คะแนนเฉลี่ยของข้อนี้':`มีคะแนน ${s.itemsWithData} จาก ${s.items} ข้อ`)+' · ไม่มีคะแนนแสดง —':`ความครอบคลุมน้ำหนัก ${fmt(s.coverage*100)}% · ไม่มีคะแนนแสดงขีด`}</p></div><span class="kpi-value">${fmt(s.value)}</span></div>${s.children.length?bars(c,s.children):mean4()?questionRawMean4(c,s):questionRaw(c,s)}${s.level==='aspect'?`<div class="notice" style="margin-top:20px">คลิกแต่ละข้อเพื่อดูคะแนนดิบ สเกล และจำนวนคำตอบ โดยไม่ปนคะแนนดิบคนละสเกลเข้าด้วยกัน</div>`:''}</section>${inlineAnalysis(c,drill)}${s.children.length?`<div class="detail-grid">${s.children.map(x=>`<button class="detail-card" data-act="drill" data-id="${x.id}"><h4>${esc(nodeName(x.node))}</h4><span class="large">${fmt(x.value)}</span><span class="muted">${unitSuffix()}</span><p class="subtle">${x.level==='question'?'มีคะแนน '+x.n+' · '+naLabel()+' '+x.noanswer+' · ค้าง '+x.missing:x.children.length+' '+(x.level==='dimension'&&!mean4()?'ด้าน':'ข้อ')} · ดูรายละเอียด →</p></button>`).join('')}</div>`:''}`;}
function questionRaw(c,s){const q=s.node,other=c.rr?M.findStat(c.rr,q.id):null;return `<div class="notice">สเกลคะแนนดิบ ${q.min}–${q.max} · ขั้นละ ${q.step} · ${q.direction==='high'?'คะแนนสูงสะท้อนผลดีกว่า':'คะแนนต่ำสะท้อนผลดีกว่า'}</div><div class="grid2"><div><div class="mini-stat"><span>ค่าเฉลี่ยคะแนนดิบ · ${esc(kindName[c.f.kind])}</span><b>${fmt(s.raw)}</b></div><div class="mini-stat"><span>คะแนนปรับสเกล</span><b>${fmt(s.value)} / 100</b></div>${other?`<div class="mini-stat"><span>ค่าเฉลี่ยคะแนนดิบ · ${esc(kindName[c.other.kind])}</span><b>${fmt(other.raw)}</b></div>`:''}</div><div><div class="mini-stat"><span>ผู้ให้คะแนน</span><b>${s.n} คน</b></div><div class="mini-stat"><span>ไม่ตอบ</span><b>${s.noanswer} คน</b></div><div class="mini-stat"><span>ยังไม่กรอก</span><b>${s.missing} คน</b></div></div></div><p class="subtle" style="margin-top:20px">สูตรข้อนี้: ${q.direction==='high'?`(คะแนน − ${q.min}) ÷ (${q.max} − ${q.min})`:`(${q.max} − คะแนน) ÷ (${q.max} − ${q.min})`} × 100</p>`;}
function analysisPrefix(f,target){return f.id+'|'+target+'|';}
function commentAuthorId(x,raterId='',formId=''){
 if(raterId&&P.people.some(p=>p.id===raterId))return raterId;
 const match=String(x.src||'').match(/^(.*?)!\$?[A-Z]+\$?(\d+)$/i);
 if(match){const ids=[...new Set(P.responses.filter(r=>(!formId||r.formId===formId)&&r.source?.sheet===match[1]&&Number(r.source?.row)===Number(match[2])).map(r=>r.raterId))];if(ids.length===1&&P.people.some(p=>p.id===ids[0]))return ids[0];}

}
function respondentComment(x,raterId='',formId=''){

}
